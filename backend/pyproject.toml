[project]
name = "ingather-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "openai>=1.50",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "numpy>=2.5.4",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]
train = ["pandas>=3.1.0", "scikit-learn>=1.9.1"]  # ml/train.py only; serving needs numpy alone

[tool.pytest.ini_options]
testpaths = ["tests"]
