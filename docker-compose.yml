services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingather
      POSTGRES_PASSWORD: ingather
      POSTGRES_DB: ingather
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingather"]
      interval: 2s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ingather:ingather@db:5432/ingather
      CORS_ORIGINS: http://localhost:8000
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  media:
